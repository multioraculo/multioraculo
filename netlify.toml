# Configuração do Netlify para o Multioráculo (Next.js 15, App Router).
#
# O adaptador oficial detecta o Next.js e configura funções, edge (middleware
# do Supabase), streaming e cache. Não fixe a versão do plugin: o Netlify
# mantém a versão compatível com o Next instalado.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Versão EXATA, a mesma do ambiente onde os goldens foram gerados. Com só
  # "22", a Netlify passou a pegar um 22.x com tzdata 2026e, que adianta o
  # horário de verão da Colômbia em 1992; o caso Bogotá do verify:astro mudou
  # e todo build falhou de 24/10 em diante. Trocar de versão pede rodar o
  # prebuild nela antes.
  NODE_VERSION = "24.18.0"
  # Desliga a telemetria do Next no build
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Funções próprias, ao lado das que o adaptador do Next gera sozinho. Duas,
# as duas agendadas, com o horário declarado no arquivo (`export const config`)
# e não aqui:
#   pregerar-horoscopo.ts  03:05 UTC (00:05 em São Paulo): pede as doze leituras
#                          do dia a /api/horoscopo, para ninguém esperar a geração
#                          de manhã. Desligada sem HOROSCOPO_PREGERAR=1.
#   aquecer-rotas.ts       a cada 5 min: pede as páginas dinâmicas e as duas APIs
#                          da Home, para a primeira visita depois de um intervalo
#                          vazio não pagar o arranque frio da função do servidor
#                          (medido: 5,9 s). Ligada; AQUECER_ROTAS=0 desliga.
[functions]
  directory = "netlify/functions"

# Variáveis de ambiente necessárias (defina em Site configuration →
# Environment variables, nunca aqui):
#   OPENAI_API_KEY
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
#   SUPABASE_SERVICE_ROLE_KEY   (webhook e contagem de tiragens; só servidor)
#   STRIPE_SECRET_KEY
#   STRIPE_WEBHOOK_SECRET
#   STRIPE_PRICE_ESSENCIAL
#   STRIPE_PRICE_ILIMITADO
#   NEXT_PUBLIC_SITE_URL        (https://multioraculo.com; URLs de retorno do Checkout)
#   PDFS_INDEX_URL              (opcional; padrão: release v1-data no GitHub)
#   HOROSCOPO_DIAGNOSTICO       (opcional. Com "1", a resposta de /api/horoscopo
#                                passa a trazer o diagnóstico por tentativa
#                                (regras do verificador, tokens, custo). Fora
#                                disso ele existe só nos registros. Não deixe
#                                ligado: é material de operação, não de leitor.)
#   HOROSCOPO_PREGERAR          (chave geral da pré-geração diária. SEM ela, a
#                                função agendada roda e não gera nada, e o
#                                horóscopo fica só sob demanda. Ponha "1" para
#                                ligar; apagar a variável desliga. Nenhuma das
#                                duas exige deploy.)
#   HOROSCOPO_PREGERAR_LOCALES  (opcional; padrão "pt". Idiomas que a função
#                                agendada pré-gera. Cada idioma são 12 gerações
#                                por dia, então ampliar isto triplica o custo
#                                do módulo; quem ficar de fora continua sendo
#                                gerado sob demanda.)
#   AQUECER_ROTAS               (opcional. Com "0", a função de aquecimento
#                                roda e não pede nada; as rotas voltam a
#                                acordar sob demanda. Apagar a variável religa.
#                                Nenhum dos dois exige deploy.)
#
# Webhook da Stripe: POST https://multioraculo.com/api/billing/webhook
# (fora do middleware do Supabase; responde só com escrita no banco).
#
# Limites relevantes do Netlify: toda função (inclusive com streaming) tem
# teto de 60 s, não configurável. Por isso a consulta é feita em duas rotas:
#   POST /consultas          → sorteio + interpretação dos 5 oráculos
#   POST /consultas/sintese  → síntese final em streaming

# ----------------------------------------------------------------------------
# Cache de assets estáticos.
#
# O adaptador do Next já serve `_next/static/*` como `immutable, 1 ano`, porque
# aqueles nomes carregam o hash do conteúdo. O que está em `public/` ele serve
# como `max-age=0, must-revalidate`: medido em produção, isso faz a Home
# revalidar 700 KB de imagem a cada visita.
#
# A REGRA AQUI É UMA SÓ: cache longo só para arquivo cujo NOME muda quando o
# conteúdo muda. Com nome fixo, cache longo significa que quem já baixou a arte
# antiga continua vendo a antiga, e a correção nunca chega.
#
#   /brand/fixo/*   tudo nessa pasta carrega a medida no nome, e trocar a arte é
#                   publicar outro nome. Seguro travar por um ano. Hoje moram
#                   ali a marca e as duas lâminas do leque dos cinco oráculos.
#
#   /tarot/arte/*   gravuras do Tarô e do Lenormand em WebP com o hash do
#   /lenormand/arte/*  conteúdo no nome, geradas por scripts/cartas-webp.mjs a
#                   partir dos PNG aprovados. Trocar a arte de uma carta gera
#                   outro nome: seguro travar.
#
# O QUE NÃO ENTROU, de propósito: os PNG de nome fixo em `/tarot/art/*` e
# `/lenormand/*.png` (a fonte aprovada; a interface só os entrega a navegador
# sem WebP, pelo <img> de reserva dentro do <picture>).
# Essas artes JÁ FORAM substituídas mantendo o mesmo nome mais de uma vez neste
# projeto. Travá-las por um ano deixaria quem visitou antes com a versão velha,
# sem jeito de corrigir.
[[headers]]
  for = "/brand/fixo/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/tarot/arte/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/lenormand/arte/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
